<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
            background-color: #0b0f19; /* Fallback dark background agar video na chale */
        }

        /* Background video */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .portfolio-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.1);
            animation: fadeInUp 1s ease-out forwards;
            position: relative;
            z-index: 1;
        }

        .portfolio-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(56, 189, 248, 0.35);
            transition: all 0.4s ease;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transition: transform 0.5s ease;
        }

        .portfolio-card:hover .profile-img {
            transform: rotate(5deg) scale(1.05);
        }

        h1 {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .tagline {
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 20px;
            font-weight: 500;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 22px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Updated video source with autoplay, muted, playsinline attributes -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
    </video>

    <div class="portfolio-card">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Profile" class="profile-img">
        <h1>Aman</h1>
        <div class="tagline">Visual Creator & Developer</div>
        <p>Welcome to my digital space. Crafting clean, aesthetic minimalist web designs and visual projects with precision.</p>
        
        <div class="social-links">
            <a href="https://github.com/amanarabab110-debug" target="_blank" class="btn">GitHub Profile</a>
        </div>
    </div>

</body>
</html>
